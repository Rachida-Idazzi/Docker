services: 
  nginx:
    image: nginx
    ports: 
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    - web

  web:
    build: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    # Ports: "5000:5000" (This part has been removed for the scaling )
    depends_on:
      - redis

  redis:
    image: redis
    
    volumes:
      - myvol:/data

volumes:
  myvol:

